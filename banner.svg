<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07070b"/>
      <stop offset="60%" stop-color="#170609"/>
      <stop offset="100%" stop-color="#2a0a0e"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4a4a"/>
      <stop offset="70%" stop-color="#c1121f"/>
      <stop offset="100%" stop-color="#7a0b13"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e5383b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e5383b" stop-opacity="0"/>
    </radialGradient>
    <style>
      .glow { animation: pulse 4s ease-in-out infinite; transform-origin: 900px 120px; }
      @keyframes pulse { 0%,100% { opacity: .6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      .name { font: 700 50px Georgia, 'Times New Roman', serif; fill: #f5f3f4; letter-spacing: 7px;
              opacity: 0; animation: rise 1.6s ease-out .3s forwards; }
      .title { font: italic 22px Georgia, serif; fill: #e5383b; letter-spacing: 6px;
               opacity: 0; animation: rise 1.6s ease-out 1.1s forwards; }
      .line { stroke: #e5383b; stroke-width: 2; stroke-dasharray: 580; stroke-dashoffset: 580;
              animation: draw 1.4s ease-out 1.6s forwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .petal { fill: #e5383b; opacity: .8; }
      .p1 { animation: fall 9s linear infinite; }
      .p2 { animation: fall 12s linear 2s infinite; }
      .p3 { animation: fall 10s linear 4s infinite; }
      .p4 { animation: fall 13s linear 1s infinite; }
      .p5 { animation: fall 11s linear 6s infinite; }
      @keyframes fall {
        0%   { transform: translate(0, -40px) rotate(0deg); opacity: 0; }
        10%  { opacity: .85; }
        100% { transform: translate(-220px, 380px) rotate(540deg); opacity: 0; }
      }
      .star { fill: #fff; animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; }
      @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
      .mist { fill: #2a0a0e; opacity: .5; animation: drift 18s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(30px); } }

      .sig { opacity: 0; animation: rise 1.4s ease-out .1s forwards; }
      .wave { fill: none; stroke: #e5383b; stroke-width: 2; animation: spin 24s linear infinite; transform-origin: 110px 150px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .pulse { fill: none; stroke: #e5383b; stroke-width: 1.5; transform-origin: 110px 150px; animation: emit 3s ease-out infinite; }
      .pulse.d2 { animation-delay: 1.5s; }
      @keyframes emit { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.7); opacity: 0; } }
      .ring { fill: #0d0d0d; stroke: #e5383b; stroke-width: 2.5; }
      .initials { font: 700 34px Georgia, serif; fill: #f5f3f4; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- stars -->
  <circle class="star" cx="120" cy="40" r="1.4"/>
  <circle class="star s2" cx="300" cy="80" r="1.1"/>
  <circle class="star s3" cx="520" cy="30" r="1.3"/>
  <circle class="star" cx="680" cy="70" r="1"/>
  <circle class="star s2" cx="1100" cy="50" r="1.4"/>
  <circle class="star s3" cx="760" cy="20" r="1.1"/>
  <circle class="star" cx="1150" cy="140" r="1"/>

  <!-- moon -->
  <circle class="glow" cx="900" cy="120" r="150" fill="url(#glow)"/>
  <circle cx="900" cy="120" r="78" fill="url(#moon)"/>
  <circle cx="875" cy="100" r="10" fill="#a4161a" opacity=".35"/>
  <circle cx="925" cy="140" r="14" fill="#a4161a" opacity=".3"/>

  <!-- mist band -->
  <ellipse class="mist" cx="900" cy="230" rx="420" ry="26"/>

  <!-- rooftop skyline -->
  <path fill="#050507" d="
    M0 320 V270 H60 V250 H110 V270 H150 V240 H200 V270 H240 V255 H300 V270
    H560 V262 H600 V270
    H700 L720 252 H760 L780 270 H800 V250 H840
    L860 232 L880 214 H940 L960 232 L980 250 H1000 V270
    H1040 V240 H1080 V270 H1120 V258 H1200 V320 Z"/>
  <!-- pagoda tiers -->
  <path fill="#050507" d="M870 214 L910 188 L950 214 Z"/>
  <rect x="902" y="160" width="16" height="30" fill="#050507"/>
  <path fill="#050507" d="M884 166 L910 146 L936 166 Z"/>
  <rect x="908" y="128" width="4" height="20" fill="#050507"/>

  <!-- antenna tower: telecom nod -->
  <g stroke="#050507" stroke-width="3" fill="none">
    <path d="M1060 240 L1072 160 L1084 240"/>
    <path d="M1064 215 H1080 M1067 190 H1077"/>
  </g>
  <circle cx="1072" cy="156" r="3" fill="#e5383b">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#e5383b" stroke-width="1.5">
    <path d="M1060 146 A16 16 0 0 1 1084 146" opacity=".7">
      <animate attributeName="opacity" values="0;.8;0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M1052 138 A28 28 0 0 1 1092 138" opacity=".5">
      <animate attributeName="opacity" values="0;.6;0" dur="2s" begin=".4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- falling petals -->
  <g transform="translate(700,0)"><ellipse class="petal p1" cx="0" cy="0" rx="6" ry="3"/></g>
  <g transform="translate(1000,0)"><ellipse class="petal p2" cx="0" cy="0" rx="5" ry="2.5"/></g>
  <g transform="translate(450,0)"><ellipse class="petal p3" cx="0" cy="0" rx="6" ry="3"/></g>
  <g transform="translate(1180,0)"><ellipse class="petal p4" cx="0" cy="0" rx="4" ry="2"/></g>
  <g transform="translate(820,0)"><ellipse class="petal p5" cx="0" cy="0" rx="5" ry="2.5"/></g>

  <!-- signal sigil -->
  <g class="sig">
    <circle class="pulse" cx="110" cy="150" r="58"/>
    <circle class="pulse d2" cx="110" cy="150" r="58"/>
