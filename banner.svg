    <circle class="ring" cx="110" cy="150" r="44"/>
    <text class="initials" x="110" y="162" text-anchor="middle">AS</text>
  </g>

  <!-- name -->
  <text class="name" x="200" y="150">AAYAN SHANDILYA</text>
  <line class="line" x1="202" y1="170" x2="780" y2="170"/>
  <text class="title" x="202" y="206">⟡ THE SIGNAL RONIN ⟡</text>
</svg>
